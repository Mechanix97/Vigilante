<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIGILANTE</title>
<!-- the record dot, same red and halo as the brand mark in the header;
     inline so the single-file UI stays a single file -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2213%22%20fill%3D%22none%22%20stroke%3D%22%23ff4d5e%22%20stroke-opacity%3D%22.3%22%20stroke-width%3D%223%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%228.5%22%20fill%3D%22%23ff4d5e%22%2F%3E%3C%2Fsvg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');

  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --surface: #12151c;
    --surface-2: #171b24;
    --border: #262b36;
    --text: #eef0f4;
    --muted: #8992a3;
    --faint: #565f70;
    --accent: #5b8cff;
    --accent-dim: #5b8cff33;
    --live: #ff4d5e;
    --live-dim: #ff4d5e26;
    --radius: 14px;
    --radius-sm: 9px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  [hidden] { display: none !important; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- header ---------- */
  header {
    flex: 0 0 auto;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    background: linear-gradient(180deg, var(--surface), var(--bg));
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--live);
    box-shadow: 0 0 0 3px var(--live-dim);
    animation: pulse 2s ease-in-out infinite;
  }
  header h1 {
    font-size: 15px; margin: 0; font-weight: 800; letter-spacing: .16em;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--border);
          border-radius: 10px; padding: 3px; }
  .tabs button {
    background: transparent; color: var(--muted); border: 0;
    border-radius: 7px; padding: 7px 16px; cursor: pointer; font: inherit;
    font-weight: 600; font-size: 13px; text-transform: capitalize;
    transition: background .15s, color .15s;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { background: var(--accent); color: #fff; }
  .tabs button[data-tab="dashboard"] { text-transform: none; letter-spacing: .03em; }

  /* ---------- the stage ----------
     There is exactly one live <video> per camera, and it stays put: tearing it
     down means a fresh WHEP negotiation -- offer, ICE, wait for a keyframe --
     which is a second or three of black. So the wall is never rebuilt between
     the dashboard and a single camera; the same tiles are re-laid-out by
     these two modes, and the picture you were already watching gets bigger. */
  #stage { position: relative; background: #000; }
  body.mode-wall #stage { flex: 1 1 auto; min-height: 0; }
  body.mode-solo #stage {
    /* width-driven 16:9 box: aspect-ratio derives the height, so it never
       stretches regardless of how tall the viewport is */
    width: calc(100% - 40px); max-width: 1100px; margin: 20px auto 0;
    aspect-ratio: 16/9; flex: 0 0 auto;
    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  }

  .wall {
    height: 100%; display: grid; grid-template-columns: 1fr;
    grid-auto-rows: 1fr; gap: 2px; background: var(--border);
  }
  @media (min-width: 700px) {
    body.mode-wall .wall.n2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    body.mode-wall .wall.n3, body.mode-wall .wall.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  }
  body.mode-solo .wall { grid-template-columns: 1fr; gap: 0; }
  body.mode-solo .tile:not(.active) { display: none; }
  body.mode-solo .tile { cursor: default; }
  body.mode-solo .tile:hover { outline: none; }
  body.mode-solo .tile .label { display: none; }  /* the tab already says which */

  .tile { background: #000; overflow: hidden; cursor: pointer; position: relative; min-height: 0; }
  .tile video { width: 100%; height: 100%; border: 0; display: block; object-fit: cover; }
  body.mode-solo .tile video { object-fit: contain; }
  /* a camera that is down should read as down, not as a black rectangle */
  .tile.offline::after {
    content: "sin señal"; position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    color: var(--faint); font-size: 13px; letter-spacing: .05em;
  }
  .tile .label {
    position: absolute; left: 16px; top: 14px; padding: 6px 14px;
    background: rgba(10,12,16,.6); border: 1px solid rgba(255,255,255,.08);
    border-radius: 8px; font-weight: 700; font-size: 15px;
    text-transform: capitalize; backdrop-filter: blur(6px);
    display: flex; align-items: center; gap: 8px;
  }
  .tile .label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 2s ease-in-out infinite; }
  .tile:hover { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* recordings play on a layer over the wall; the live streams underneath
     stay connected, so going back to live is immediate */
  #play-layer { position: absolute; inset: 0; background: #000; }
  #play-layer video { width: 100%; height: 100%; border: 0; display: block; }
  #stage .empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--faint); font-size: 13px; text-align: center; padding: 0 24px;
  }

  /* ---------- scrub bar: live toggle + day picker + jump, always live ---------- */
  .scrub {
    margin: 14px auto 0; width: calc(100% - 40px); max-width: 1100px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px;
  }
  /* three columns so the transport is exactly centred regardless of how wide
     the live button or the selects happen to be */
  .scrub-top {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 10px; margin-bottom: 12px;
  }
  .scrub-top > .live-btn { justify-self: start; }
  .scrub-top > .transport { justify-self: center; }
  .scrub-top > .scrub-controls { justify-self: end; }
  .live-btn {
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
    padding: 8px 16px; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 700;
    font-size: 13px; letter-spacing: .04em; transition: all .15s;
  }
  .live-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .live-btn.active { background: var(--live-dim); border-color: var(--live); color: var(--live); }
  .live-btn.active .dot { background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
  .live-btn:hover { border-color: var(--accent); color: var(--text); }
  .live-btn.active:hover { border-color: var(--live); color: var(--live); }

  /* transport sits in the middle of the row, flanked by the live button and
     the selects; on a phone the row wraps and it centres on its own line */
  .transport {
    display: flex; align-items: center; gap: 8px;
    margin: 0 auto; order: 2;
  }
  .transport button, .icon-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
    width: 40px; height: 38px;
  }
  .transport button svg, .icon-btn svg { width: 21px; height: 21px; }
  .transport button.primary {
    width: 48px; height: 44px; background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .transport button.primary svg { width: 19px; height: 19px; }
  .transport button:hover:not(:disabled), .icon-btn:hover { border-color: var(--accent); }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .icon-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .transport button.primary:hover:not(:disabled) { filter: brightness(1.12); }
  .transport button:disabled { opacity: .3; cursor: default; }

  .scrub-controls { display: flex; align-items: center; gap: 8px; order: 3; }
  .live-btn { order: 1; }
  #day-select, #speed-select {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font: inherit; font-weight: 600; font-size: 13px;
    color-scheme: dark; cursor: pointer;
  }
  #day-select:disabled, #speed-select:disabled { opacity: .35; cursor: default; }
  #day-select { text-transform: capitalize; }

  input[type="range"].timeline {
    -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
    border-radius: 99px; background: var(--surface-2); cursor: pointer; outline: none;
  }
  input[type="range"].timeline:disabled { cursor: default; opacity: .35; }
  input[type="range"].timeline::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 3px solid #fff2; cursor: pointer;
    box-shadow: 0 0 0 4px var(--accent-dim);
  }
  input[type="range"].timeline::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: var(--accent);
    border: 3px solid #fff2; cursor: pointer; box-shadow: 0 0 0 4px var(--accent-dim);
  }
  .timeline-wrap { position: relative; }
  /* follows the thumb, so the time you are scrubbing to is right under your
     finger instead of somewhere else on the page */
  .scrub-bubble {
    position: absolute; bottom: calc(100% + 10px); transform: translateX(-50%);
    background: var(--accent); color: #fff; font-weight: 700; font-size: 14px;
    padding: 5px 10px; border-radius: 8px; white-space: nowrap; pointer-events: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.45); z-index: 2;
  }
  .scrub-bubble::after {
    content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: var(--accent);
  }
  .timeline-ends {
    display: flex; justify-content: space-between; margin-top: 6px;
    font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums;
  }
  .scrub-clock {
    margin-top: 12px; text-align: center; font-size: 26px; font-weight: 700; letter-spacing: .03em;
  }

  /* ---------- phone ---------- */
  @media (max-width: 680px) {
    header { padding: 10px 14px; gap: 10px; }
    header h1 { font-size: 13px; }
    .tabs { width: 100%; overflow-x: auto; }
    .tabs button { padding: 9px 14px; font-size: 14px; }
    main { padding: 10px; }
    body.mode-solo #stage { width: calc(100% - 20px); margin-top: 10px; border-radius: 10px; }
    .scrub { width: calc(100% - 20px); }
    .scrub { margin-top: 10px; padding: 12px 12px 14px; border-radius: 12px; }
    /* one row for the transport, one for everything else */
    .scrub-top { grid-template-columns: 1fr 1fr; gap: 10px; }
    .scrub-top > .transport {
      grid-column: 1 / -1; order: -1; gap: 14px;
    }
    .scrub-top > .live-btn { justify-self: start; }
    .scrub-top > .scrub-controls { justify-self: end; }
    /* fingers, not cursors */
    .transport button { width: 52px; height: 48px; }
    .transport button svg { width: 26px; height: 26px; }
    .transport button.primary { width: 62px; height: 52px; }
    .transport button.primary svg { width: 23px; height: 23px; }
    .icon-btn { width: 44px; height: 42px; }
    #day-select, #speed-select { padding: 9px 8px; font-size: 14px; }
    input[type="range"].timeline { height: 10px; }
    input[type="range"].timeline::-webkit-slider-thumb { width: 24px; height: 24px; }
    input[type="range"].timeline::-moz-range-thumb { width: 24px; height: 24px; }
    .scrub-bubble { font-size: 15px; padding: 6px 12px; }
    .timeline-ends { font-size: 12px; }
    .scrub-clock { font-size: 30px; }
    /* stack the wall on phones so each camera is still worth looking at */
    body.mode-wall .wall.n2, body.mode-wall .wall.n3, body.mode-wall .wall.n4 { grid-template-columns: 1fr; }
  }

  /* the stage itself goes fullscreen, so it must fill the screen there */
  #stage:fullscreen, #stage:-webkit-full-screen {
    width: 100vw; height: 100vh; max-width: none; aspect-ratio: auto;
    margin: 0; border: 0; border-radius: 0;
  }
  #stage:fullscreen video { object-fit: contain; }
</style>
</head>
<body class="mode-wall">
<header>
  <div class="brand"><span class="dot"></span><h1>VIGILANTE</h1></div>
  <div class="tabs" id="tabs"></div>
</header>

<main id="stage">
  <div class="wall" id="wall"></div>
  <div id="play-layer" hidden></div>
  <div class="empty" id="stage-empty" hidden>Cargando…</div>
</main>

<div id="single" hidden>
  <div class="scrub">
    <div class="scrub-top">
      <button class="live-btn active" id="live-btn"><span class="dot"></span><span id="live-btn-label">EN VIVO</span></button>

      <div class="transport">
        <button id="back10-btn" title="Retroceder 10s" aria-label="Retroceder 10 segundos" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5V2L7.5 6 12 10V7a6.5 6.5 0 1 1-6.4 7.7"/>
            <text x="12" y="16.6" font-size="7.5" font-weight="700" text-anchor="middle"
                  fill="currentColor" stroke="none">10</text>
          </svg>
        </button>
        <button id="play-btn" class="primary" title="Pausar / Reproducir"
                aria-label="Pausar o reproducir" disabled></button>
        <button id="fwd10-btn" title="Avanzar 10s" aria-label="Avanzar 10 segundos" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5V2l4.5 4L12 10V7a6.5 6.5 0 1 0 6.4 7.7"/>
            <text x="12" y="16.6" font-size="7.5" font-weight="700" text-anchor="middle"
                  fill="currentColor" stroke="none">10</text>
          </svg>
        </button>
      </div>

      <div class="scrub-controls">
        <select id="speed-select" disabled>
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
          <option value="16">16×</option>
        </select>
        <select id="day-select"></select>
        <button id="sound-btn" class="icon-btn" title="Activar sonido" aria-label="Activar sonido"></button>
        <button id="fs-btn" class="icon-btn" title="Pantalla completa" aria-label="Pantalla completa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="timeline-wrap">
      <div class="scrub-bubble mono" id="bubble" hidden>--:--:--</div>
      <input type="range" class="timeline" id="timeline" min="0" max="0" value="0" step="1">
      <div class="timeline-ends"><span id="t-start">--:--</span><span id="t-end">--:--</span></div>
    </div>
    <div class="scrub-clock mono" id="clock">--:--:--</div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const stage = $("#stage"), wall = $("#wall");
const playLayer = $("#play-layer"), vpEmpty = $("#stage-empty");
const timeline = $("#timeline"), clock = $("#clock"), bubble = $("#bubble");
const tStart = $("#t-start"), tEnd = $("#t-end");
const daySelect = $("#day-select"), speedSelect = $("#speed-select");
const liveBtn = $("#live-btn"), liveBtnLabel = $("#live-btn-label");
const soundBtn = $("#sound-btn");
const playBtn = $("#play-btn"), back10Btn = $("#back10-btn"), fwd10Btn = $("#fwd10-btn");
let cameras = [], mediamtxUrl = "", currentCam = null;
let allDays = [], activeDay = null, atLiveEdge = false;
let video = null, dragging = false, liveClockTimer = null;
let curSeg = -1, pendingSeek = null, lastEnded = { seg: -1, at: -1 };
const daysCache = {};   // per camera, so reopening a tab draws immediately
const livePcs = {}, retryTimers = {};
// per-camera sound preference. Muted unless the viewer has said otherwise --
// and even then the browser only lets it through after a gesture, which the
// sound button itself provides.
let muted = {};
try { muted = JSON.parse(localStorage.getItem("vigilante.muted") || "{}"); } catch {}

function fmtDate(yyyymmdd) {
  return `${yyyymmdd.slice(6, 8)}/${yyyymmdd.slice(4, 6)}/${yyyymmdd.slice(0, 4)}`;
}
function fmtHMS(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds)) % 86400;
  const h = String(Math.floor(s / 3600)).padStart(2, "0");
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  const sec = String(s % 60).padStart(2, "0");
  return `${h}:${m}:${sec}`;
}
function liveSrc(cam) { return `${mediamtxUrl}/${cam}/`; }

// ---------------- video position <-> wall-clock mapping ----------------
// `breaks` is [{cum, wall, dur}], dur:null meaning "runs to the end".
function videoToWall(breaks, v) {
  for (const b of breaks) {
    const d = b.dur == null ? Infinity : b.dur;
    if (v >= b.cum && v < b.cum + d) return b.wall + (v - b.cum);
  }
  const last = breaks[breaks.length - 1];
  return last ? last.wall + (last.dur ?? 0) : 0;
}
function wallToVideo(breaks, w) {
  for (const b of breaks) {
    const d = b.dur == null ? Infinity : b.dur;
    if (w >= b.wall && w < b.wall + d) return b.cum + (w - b.wall);
  }
  // asked for a moment inside a gap, or past what has been stitched so far:
  // land on the nearest edge we do have rather than leaving the player stuck
  let best = 0, bestDist = Infinity;
  for (const b of breaks) {
    const d = b.dur == null ? 0 : b.dur;
    for (const [vv, ww] of [[b.cum, b.wall], [b.cum + d, b.wall + d]]) {
      const dist = Math.abs(w - ww);
      if (dist < bestDist) { bestDist = dist; best = vv; }
    }
  }
  return best;
}
// The earliest and latest moment the day covers. Taken over every break
// rather than just the first and last: breaks arrive in file order, and a
// recorder session that spans midnight can hand us one that is out of order,
// which used to leave the slider with min > max -- a range input given that
// silently refuses to move.
function dayStartWall(day) {
  return day.breaks.length ? Math.min(...day.breaks.map((b) => b.wall)) : 0;
}
function dayEndWall(day) {
  const last = day.breaks.reduce(
    (a, b) => (b.wall + (b.dur ?? 0) > a.wall + (a.dur ?? 0) ? b : a),
    day.breaks[0]);
  if (!last) return 0;
  // a day consolidated before aidot-webrtc wrote timeline sidecars: how long
  // it runs is only known once the browser has the file's metadata, so span
  // the rest of the day for now and narrow it in `loadedmetadata`
  return last.dur == null ? 86399 : last.wall + last.dur;
}
// Today is a list of segments rather than one file: find which one covers a
// given time of day, and how far into it that time falls.
function segmentAt(day, wall) {
  const segs = day.segments || [];
  for (let i = 0; i < segs.length; i++) {
    if (wall >= segs[i].wall && wall < segs[i].wall + segs[i].dur) {
      return { i, offset: wall - segs[i].wall };
    }
  }
  // asked for a moment nothing was recorded for (the camera was down, or it
  // is so recent the recorder hasn't flushed it yet): land on the closest
  // edge we do have instead of leaving the player with nowhere to go
  let best = null, bestDist = Infinity;
  for (let i = 0; i < segs.length; i++) {
    for (const [off, w] of [[0, segs[i].wall], [segs[i].dur, segs[i].wall + segs[i].dur]]) {
      const dist = Math.abs(wall - w);
      if (dist < bestDist) { bestDist = dist; best = { i, offset: Math.max(0, off - 0.3) }; }
    }
  }
  return best;
}
function nowWall() {
  const p = new Intl.DateTimeFormat("en-GB", {
    timeZone: "America/Argentina/Buenos_Aires",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
  }).formatToParts(new Date());
  const g = (t) => Number(p.find((x) => x.type === t).value);
  return g("hour") * 3600 + g("minute") * 60 + g("second");
}
// ---------------- the wall ----------------
// One live <video> per camera, living in its tile. The dashboard and a single
// camera are the same tiles under different CSS, so opening a camera does not
// touch the stream you were already watching -- it just fills the stage.
// Rebuilding it would restart the WHEP negotiation: offer, ICE, wait for a
// keyframe, which is the black second or two. What does drop a stream is
// scheduleRelease(), once you have clearly settled somewhere else.
function showLive(cam) {
  for (const tile of wall.children) tile.classList.toggle("active", tile.dataset.cam === cam);
  fillWall();
  applyMute(cam);
  vpEmpty.hidden = !!mediamtxUrl;
  if (!mediamtxUrl) vpEmpty.textContent = "Vista en vivo no configurada";
  playLayer.hidden = true;
  if (video) video.pause();   // kept around, just not on screen
}

function showPlayback() {
  playLayer.hidden = false;
  vpEmpty.hidden = true;
  // the live tile is still connected underneath; it must not keep talking
  // over the recording
  for (const tile of wall.children) {
    const v = tile.querySelector("video");
    if (v) v.muted = true;
  }
  updateSoundBtn();
}

// ---------------- tabs ----------------
function buildTabs() {
  const tabs = $("#tabs");
  tabs.innerHTML = "";
  const mk = (tab, label) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.dataset.tab = tab;
    b.onclick = () => showTab(tab);
    tabs.appendChild(b);
  };
  mk("dashboard", "DASHBOARD");
  cameras.forEach((cam) => mk(cam, cam));
}

function showTab(tab) {
  document.querySelectorAll(".tabs button").forEach(
    (b) => b.classList.toggle("active", b.dataset.tab === tab));
  if (tab === "dashboard") {
    currentCam = null;
    stopLiveClock();
    document.title = "VIGILANTE";
    document.body.className = "mode-wall";
    $("#single").hidden = true;
    playLayer.hidden = true;
    vpEmpty.hidden = true;
    if (video) video.pause();
    for (const tile of wall.children) {
      tile.classList.remove("active");
      // the wall is many cameras at once; none of them gets to talk
      const v = tile.querySelector("video");
      if (v) v.muted = true;
    }
    fillWall();
    updateSoundBtn();
  } else {
    document.body.className = "mode-solo";
    $("#single").hidden = false;
    showCamera(tab);
  }
  scheduleRelease();
}

// Watching one camera doesn't need the other tiles decoding behind it, but
// dropping them the instant you switch would make going back slow again --
// so off-screen streams get a grace period first.
const IDLE_RELEASE_MS = 45000;
let idleTimer = null;
function scheduleRelease() {
  clearTimeout(idleTimer);
  if (!currentCam) return;   // the wall needs all of them
  idleTimer = setTimeout(() => {
    for (const tile of wall.children) {
      if (tile.dataset.cam !== currentCam) dropTile(tile);
    }
  }, IDLE_RELEASE_MS);
}

// ---------------- the tiles ----------------
function buildWall() {
  wall.className = "wall n" + cameras.length;
  wall.innerHTML = "";
  if (!cameras.length) {
    vpEmpty.hidden = false;
    vpEmpty.textContent = "Sin cámaras";
    return;
  }
  cameras.forEach((cam) => {
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.dataset.cam = cam;
    tile.innerHTML = `<span class="label">${mediamtxUrl ? '<span class="dot"></span>' : ""}${cam}</span>`;
    tile.onclick = () => { if (!currentCam) showTab(cam); };
    wall.appendChild(tile);
  });
  fillWall();
}

// tiles are built once; their streams come and go with scheduleRelease()
// Our own WHEP client rather than mediamtx's player page in an iframe. The
// iframe worked, but it is a different origin, so its <video> was out of
// reach -- and muting is a property of the element, which is why there was no
// way to offer sound. Owning the element also means owning fullscreen and the
// reconnect policy.
//
// Non-trickle: gather the candidates first, then POST the offer once. mediamtx
// answers with the full description, so there is nothing to trickle back, and
// it avoids having to keep the PATCH resource alive.
async function whepConnect(cam, videoEl) {
  const pc = new RTCPeerConnection({ iceServers: [] });
  pc.addTransceiver("video", { direction: "recvonly" });
  pc.addTransceiver("audio", { direction: "recvonly" });

  const stream = new MediaStream();
  pc.ontrack = (ev) => {
    stream.addTrack(ev.track);
    videoEl.srcObject = stream;
    videoEl.play().catch(() => {});
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await new Promise((done) => {
    if (pc.iceGatheringState === "complete") return done();
    // don't let one unreachable STUN server hold the picture hostage
    const t = setTimeout(done, 3000);
    pc.addEventListener("icegatheringstatechange", () => {
      if (pc.iceGatheringState === "complete") { clearTimeout(t); done(); }
    });
  });

  const res = await fetch(`${mediamtxUrl}/${cam}/whep`, {
    method: "POST",
    headers: { "Content-Type": "application/sdp" },
    body: pc.localDescription.sdp,
  });
  if (!res.ok) throw new Error(`whep ${res.status}`);
  await pc.setRemoteDescription({ type: "answer", sdp: await res.text() });
  return pc;
}

function tileVideo(tile) {
  let v = tile.querySelector("video");
  if (!v) {
    v = document.createElement("video");
    v.playsInline = true;
    v.autoplay = true;
    // Muted is not a default we chose: a browser refuses to autoplay audio
    // without a gesture, and a wall of cameras that all start talking would
    // be the wrong behaviour anyway. The sound button opts one in.
    v.muted = true;
    tile.prepend(v);
  }
  return v;
}

// Reconnects on its own: the publisher goes away whenever the camera does,
// and mediamtx answers 404 until it is back. Backs off to 5s so a camera that
// is down overnight isn't hammered.
function connectTile(tile) {
  const cam = tile.dataset.cam;
  if (tile.dataset.connecting === "1") return;
  tile.dataset.connecting = "1";
  const v = tileVideo(tile);

  whepConnect(cam, v).then((pc) => {
    tile.dataset.connecting = "";
    // the tile may have been released while this was in flight
    if (!wantsLive(cam) || !v.isConnected) { try { pc.close(); } catch {} return; }
    livePcs[cam] = pc;
    tile.classList.remove("offline");
    pc.addEventListener("connectionstatechange", () => {
      // "disconnected" is usually a blip that ICE recovers from on its own;
      // only a terminal state is worth tearing down and redialling for
      if (pc.connectionState === "failed" || pc.connectionState === "closed") {
        dropTile(tile);
        if (wantsLive(cam)) retryTile(tile);
      }
    });
    applyMute(cam);
  }).catch(() => {
    tile.dataset.connecting = "";
    tile.classList.add("offline");
    if (wantsLive(cam)) retryTile(tile);
  });
}

function retryTile(tile) {
  clearTimeout(retryTimers[tile.dataset.cam]);
  retryTimers[tile.dataset.cam] = setTimeout(() => {
    if (wantsLive(tile.dataset.cam)) connectTile(tile);
  }, 5000);
}

function wantsLive(cam) {
  return !!mediamtxUrl && (!currentCam || currentCam === cam);
}

function dropTile(tile) {
  const cam = tile.dataset.cam;
  clearTimeout(retryTimers[cam]);
  const pc = livePcs[cam];
  if (pc) { try { pc.close(); } catch {} delete livePcs[cam]; }
  const v = tile.querySelector("video");
  if (v) { v.srcObject = null; v.remove(); }
  tile.dataset.connecting = "";
}

function fillWall() {
  if (!mediamtxUrl) return;
  for (const tile of wall.children) {
    if (!wantsLive(tile.dataset.cam)) continue;
    if (livePcs[tile.dataset.cam] || tile.dataset.connecting === "1") continue;
    connectTile(tile);
  }
}

// ---------------- sound ----------------
// Only the camera being watched on its own can be unmuted, and only live:
// recordings are video-only, and a wall of cameras all unmuted at once is
// nobody's idea of useful.
function soundOn() {
  return currentCam && muted[currentCam] === false;
}

function applyMute(cam) {
  const tile = [...wall.children].find((t) => t.dataset.cam === cam);
  const v = tile && tile.querySelector("video");
  if (v) {
    const on = cam === currentCam && muted[cam] === false && atLiveEdge;
    v.muted = !on;
    // the browser can still refuse; if it does, say so in the button rather
    // than leave it claiming sound is on
    if (on) v.play().catch(() => { v.muted = true; updateSoundBtn(); });
  }
  updateSoundBtn();
}

const ICON_SOUND_ON =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"'
  + ' stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M4 9.5v5h3.2L12 18.6V5.4L7.2 9.5H4z" fill="currentColor"/>'
  + '<path d="M15.6 8.8a4.2 4.2 0 0 1 0 6.4M18.2 6.2a7.8 7.8 0 0 1 0 11.6"/></svg>';
const ICON_SOUND_OFF =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"'
  + ' stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M4 9.5v5h3.2L12 18.6V5.4L7.2 9.5H4z" fill="currentColor"/>'
  + '<path d="M16 10l4 4M20 10l-4 4"/></svg>';

function updateSoundBtn() {
  const live = !!currentCam && atLiveEdge && !!mediamtxUrl;
  soundBtn.hidden = !mediamtxUrl;
  soundBtn.disabled = !live;
  const on = live && soundOn();
  soundBtn.innerHTML = on ? ICON_SOUND_ON : ICON_SOUND_OFF;
  soundBtn.classList.toggle("on", on);
  soundBtn.title = on ? "Silenciar" : "Activar sonido";
}

soundBtn.onclick = () => {
  if (!currentCam) return;
  // absent means muted, so "is it muted" is `!== false` -- not `=== true`,
  // which would read the untouched default as unmuted and need two clicks
  muted[currentCam] = muted[currentCam] === false;
  try { localStorage.setItem("vigilante.muted", JSON.stringify(muted)); } catch {}
  applyMute(currentCam);
};

// ---------------- clock// ---------------- clock (runs all day today, live or rewound) ----------------
// The right edge of the slider is *now*, even while watching something older,
// so dragging right always leads back to live and dragging left always means
// going back that much real time.
function startLiveClock() {
  stopLiveClock();
  const tick = () => {
    const now = nowWall();
    if (activeDay && activeDay.live && !dragging) timeline.max = now;
    if (atLiveEdge) {
      clock.textContent = fmtHMS(now);
      if (!dragging) pinToLiveEdge();
    }
  };
  tick();
  liveClockTimer = setInterval(tick, 1000);
}
function stopLiveClock() {
  if (liveClockTimer) { clearInterval(liveClockTimer); liveClockTimer = null; }
}

// ---------------- day select ----------------
function buildDaySelect() {
  daySelect.innerHTML = "";
  allDays.forEach((d) => {
    const opt = document.createElement("option");
    opt.value = d.date;
    opt.textContent = d.live ? "Hoy" : fmtDate(d.date);
    daySelect.appendChild(opt);
  });
  if (activeDay) daySelect.value = activeDay.date;
}
daySelect.addEventListener("change", () => {
  const day = allDays.find((d) => d.date === daySelect.value);
  if (!day) return;
  if (day.live) enterLiveEdge(day); else enterPlayback(day, dayStartWall(day));
});

// ---------------- transport (pause, ±10s, speed) ----------------
function setTransportEnabled(enabled) {
  playBtn.disabled = back10Btn.disabled = fwd10Btn.disabled = speedSelect.disabled = !enabled;
}
const ICON_PAUSE =
  '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="4.5" width="4" height="15" rx="1.3"/>'
  + '<rect x="13.5" y="4.5" width="4" height="15" rx="1.3"/></svg>';
const ICON_PLAY =
  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 4.9v14.2a1 1 0 0 0 1.53.85l11.2-7.1a1 1 0 0 0 0-1.7L9.03 4.05A1 1 0 0 0 7.5 4.9z"/></svg>';

function updatePlayIcon() {
  playBtn.innerHTML = video && !video.paused ? ICON_PAUSE : ICON_PLAY;
}
updatePlayIcon();
playBtn.onclick = () => {
  if (!video) return;
  if (video.paused) video.play(); else video.pause();
};
// ±10s move along the *timeline*, not inside the current file, so they step
// over segment boundaries (and over gaps) like the slider does. Rewinding
// while live is what drops you out of live in the first place.
function nudge(delta) {
  if (!activeDay) return;
  if (atLiveEdge) { enterPlayback(activeDay, nowWall() + delta); return; }
  const wall = Math.max(Number(timeline.min),
                        Math.min(Number(timeline.max), Number(timeline.value) + delta));
  timeline.value = wall;
  clock.textContent = fmtHMS(wall);
  seekWall(wall);
}
back10Btn.onclick = () => nudge(-10);
fwd10Btn.onclick = () => nudge(10);
// Browsers clamp playbackRate to their own range (Chrome allows 0.0625..16)
// and some throw outside it rather than clamping, which would take the whole
// handler down with it. The select is the intent; this is what the element
// actually accepted.
function applyRate() {
  if (!video) return;
  const want = Number(speedSelect.value);
  try {
    video.playbackRate = want;
  } catch {
    video.playbackRate = Math.max(0.25, Math.min(4, want));
  }
}
speedSelect.addEventListener("change", applyRate);

// ---------------- fullscreen ----------------
// The stage holds whichever of the two is showing (recording or live tile),
// so fullscreening it covers both. iOS Safari won't do that for arbitrary
// elements though -- there, only a <video> can go fullscreen, via its own
// webkit call.
// iOS only fullscreens a <video>, so it needs whichever one is on screen
function fullscreenTarget() {
  if (!atLiveEdge) return video;
  const tile = [...wall.children].find((t) => t.dataset.cam === currentCam);
  return tile && tile.querySelector("video");
}

$("#fs-btn").onclick = () => {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    return;
  }
  const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
  if (req) {
    req.call(stage).catch(() => {
      const el = fullscreenTarget();
      if (el && el.webkitEnterFullscreen) el.webkitEnterFullscreen();
    });
  } else {
    const el = fullscreenTarget();
    if (el && el.webkitEnterFullscreen) el.webkitEnterFullscreen();   // iPhone
  }
};

// ---------------- the timeline is in time-of-day, not video position -------
// Driving the slider in wall-clock seconds is what makes "go back a minute"
// mean a minute of real time: positions are resolved against the recording
// only at the moment we seek, so a gap in the footage costs a minute of
// dragging rather than silently shifting everything after it.
function fmtHM(sec) { return fmtHMS(sec).slice(0, 5); }

// Place the bubble over the thumb. A range input gives no thumb position, so
// derive it: the track is inset by half a thumb at each end, which is exactly
// how the browser lays the thumb out.
const THUMB = 22;
function placeBubble(wall) {
  const lo = Number(timeline.min), hi = Number(timeline.max);
  const frac = hi > lo ? (wall - lo) / (hi - lo) : 1;
  const usable = timeline.clientWidth - THUMB;
  bubble.style.left = `${THUMB / 2 + frac * usable}px`;
  bubble.textContent = fmtHMS(wall);
}
function showBubble(wall) { bubble.hidden = false; placeBubble(wall); }
function hideBubble() { bubble.hidden = true; }

function setTimelineRange(day) {
  const lo = dayStartWall(day);
  const hi = day.live ? nowWall() : dayEndWall(day);
  // never hand the input an empty or inverted range: it would stop responding
  // altogether, which looks exactly like a frozen slider
  timeline.min = Math.min(lo, hi - 1);
  timeline.max = Math.max(hi, lo + 1);
  tStart.textContent = fmtHM(Number(timeline.min));
  tEnd.textContent = day.live ? "ahora" : fmtHM(Number(timeline.max));
}

// At the live edge the thumb belongs hard right, always: the range is
// start-of-day..now and now is the right-hand end by definition. Re-asserted
// on every tick rather than set once, because `max` moves every second.
function pinToLiveEdge() {
  timeline.value = timeline.max;
}

// ---------------- live edge (real mediamtx stream) ----------------
function enterLiveEdge(day) {
  activeDay = day;
  atLiveEdge = true;
  liveBtn.classList.add("active");
  liveBtnLabel.textContent = "EN VIVO";
  daySelect.value = day.date;
  setTransportEnabled(false);
  back10Btn.disabled = false;   // rewinding is how you leave the live edge

  showLive(currentCam);

  setTimelineRange(day);
  pinToLiveEdge();
  hideBubble();
  updatePlayIcon();
  startLiveClock();
}

// ---------------- playback (a specific day, or today rewound) ----------------
// Which file backs a given moment is decided here, not by the caller: a past
// day is one consolidated file, today is whichever segment covers that second.
function currentWall() {
  if (!video || !activeDay) return Number(timeline.value);
  if (activeDay.segments) {
    const seg = activeDay.segments[curSeg];
    return seg ? seg.wall + video.currentTime : Number(timeline.value);
  }
  return videoToWall(activeDay.breaks, video.currentTime);
}

function setVideoTime(t) {
  // seeking before metadata arrives is ignored by the browser, so remember it
  if (video.readyState >= 1) video.currentTime = t;
  else pendingSeek = t;
}

function loadSegment(i, offset) {
  curSeg = i;
  pendingSeek = offset;
  video.src = activeDay.segments[i].url;
  video.load();
  video.play().catch(() => {});
}

function seekWall(wall) {
  if (!video || !activeDay) return;
  if (activeDay.segments) {
    const hit = segmentAt(activeDay, wall);
    if (!hit) return;
    if (hit.i !== curSeg) loadSegment(hit.i, hit.offset);
    else setVideoTime(hit.offset);
  } else {
    setVideoTime(wallToVideo(activeDay.breaks, wall));
  }
}

// A segment ending isn't the end of the recording, just the end of a file:
// roll into the next one. Running out of segments means we've caught up with
// the recorder, so the live stream is the right place to be.
async function onSegmentEnded() {
  if (!activeDay || !activeDay.segments || atLiveEdge) return;
  if (curSeg + 1 >= activeDay.segments.length) await refreshDays();
  if (activeDay.segments && curSeg + 1 < activeDay.segments.length) {
    loadSegment(curSeg + 1, 0);
    return;
  }
  // No next file: either we really are at the live edge, or we hit the end of
  // however much of the growing segment the browser was handed when it asked
  // for it -- reloading gets the rest. Only once, though: if it ends twice in
  // the same place there is nothing more coming and live is where to be.
  const pos = video.currentTime;
  const seg = activeDay.segments && activeDay.segments[curSeg];
  const stuck = lastEnded.seg === curSeg && Math.abs(lastEnded.at - pos) < 1;
  lastEnded = { seg: curSeg, at: pos };
  if (!stuck && seg && nowWall() - (seg.wall + pos) > 30) {
    loadSegment(curSeg, Math.max(0, pos - 0.5));
  } else {
    enterLiveEdge(activeDay);
  }
}

function sameVideo(day) {
  return video && video.dataset.day === day.date && video.dataset.cam === currentCam;
}

function ensureVideo(day) {
  if (sameVideo(day)) return;
  playLayer.innerHTML = "";
  video = document.createElement("video");
  video.dataset.cam = currentCam;
  video.controls = false;
  video.playsInline = true;
  video.autoplay = true;
  video.dataset.day = day.date;
  playLayer.appendChild(video);
  video.addEventListener("loadedmetadata", () => {
    const last = !day.segments && day.breaks[day.breaks.length - 1];
    if (last && last.dur == null && video.duration) {
      timeline.max = last.wall + video.duration;
    }
    if (pendingSeek != null) {
      video.currentTime = Math.min(pendingSeek, video.duration || pendingSeek);
      pendingSeek = null;
    }
    applyRate();
  });
  video.addEventListener("timeupdate", () => {
    const wall = currentWall();
    if (!dragging) timeline.value = wall;
    clock.textContent = fmtHMS(wall);
  });
  video.addEventListener("ended", onSegmentEnded);
  video.addEventListener("play", updatePlayIcon);
  video.addEventListener("pause", updatePlayIcon);
}

function enterPlayback(day, atWall) {
  activeDay = day;
  atLiveEdge = false;
  liveBtn.classList.remove("active");
  liveBtnLabel.textContent = "VOLVER A VIVO";
  daySelect.value = day.date;
  setTransportEnabled(true);

  showPlayback();
  setTimelineRange(day);
  const wall = Math.max(Number(timeline.min),
                        Math.min(atWall, Number(timeline.max)));
  timeline.value = wall;

  const fresh = !sameVideo(day);
  ensureVideo(day);
  if (fresh) curSeg = -1;
  if (!day.segments && fresh) {
    pendingSeek = wallToVideo(day.breaks, wall);
    video.src = day.url;
  } else {
    seekWall(wall);
  }
  if (!fresh && video.paused) video.play().catch(() => {});
  if (day.live) startLiveClock(); else stopLiveClock();
  updatePlayIcon();
  clock.textContent = fmtHMS(wall);
}

liveBtn.onclick = () => {
  const today = allDays.find((d) => d.live);
  if (today) enterLiveEdge(today);
};

// dragging left off the live edge drops into playback at that time of day;
// dragging back to the edge returns to the real live stream
timeline.addEventListener("input", () => {
  if (!activeDay) return;
  dragging = true;
  const wall = Number(timeline.value);
  clock.textContent = fmtHMS(wall);
  showBubble(wall);
  if (atLiveEdge && wall < Number(timeline.max) - 2) {
    enterPlayback(activeDay, wall);
    dragging = true;  // enterPlayback repoints the slider; stay in the drag
    showBubble(Number(timeline.value));
  }
});

function endDrag() {
  if (!dragging) return;
  const wall = Number(timeline.value);
  dragging = false;
  hideBubble();
  if (!activeDay) return;
  if (activeDay.live && wall >= nowWall() - 5) enterLiveEdge(activeDay);
  else seekWall(wall);
}
timeline.addEventListener("change", endDrag);
// `change` is the only event that clears `dragging`, and it does not always
// arrive -- a touch that ends outside the control, or a drag interrupted by
// the tab being hidden, leaves it set. While it is set the clock stops moving
// the thumb, so the slider looks frozen at the live edge. These are the
// belt-and-braces releases.
for (const ev of ["pointerup", "pointercancel", "touchend", "touchcancel", "blur"]) {
  timeline.addEventListener(ev, endDrag);
}
window.addEventListener("pointerup", endDrag);
addEventListener("resize", () => { if (dragging) placeBubble(Number(timeline.value)); });

// ---------------- per-camera bootstrap ----------------
// Adopting a fresh listing must not disturb what is playing: same day, more
// segments. `activeDay` is repointed so the newest footage becomes reachable.
function adoptDays(days) {
  allDays = days;
  buildDaySelect();
  if (!activeDay) return;
  const match = days.find((d) => d.date === activeDay.date);
  if (match) activeDay = match;
}

async function refreshDays(cam = currentCam) {
  const { days } = await fetch(`/api/cameras/${cam}/days`).then((r) => r.json());
  daysCache[cam] = days;
  if (cam === currentCam) adoptDays(days);
  return days;
}

function openDays(days) {
  const today = days.find((d) => d.live);
  if (today) enterLiveEdge(today);
  else if (days.length) enterPlayback(days[0], dayStartWall(days[0]));
  else {
    // nothing recorded yet is no reason to hide the live picture
    activeDay = null; atLiveEdge = false;
    showLive(currentCam);
    timeline.max = 0; timeline.value = 0;
    clock.textContent = "--:--:--";
    setTransportEnabled(false);
  }
}

async function showCamera(cam) {
  currentCam = cam;
  document.title = `VIGILANTE — ${cam}`;
  // put the picture up first and sort the timeline out after: the day listing
  // has to probe the segment still being written, and there is no reason to
  // stare at an empty box while that happens
  showLive(cam);
  if (daysCache[cam]) {
    allDays = daysCache[cam];
    buildDaySelect();
    openDays(allDays);
    refreshDays(cam);
  } else {
    const days = await refreshDays(cam);
    if (cam !== currentCam) return;   // tabbed away while we waited
    openDays(days);
  }
}

async function init() {
  const [{ cameras: cams }, cfg] = await Promise.all([
    fetch("/api/cameras").then((r) => r.json()),
    fetch("/api/config").then((r) => r.json()),
  ]);
  cameras = cams;
  mediamtxUrl = cfg.mediamtx_url;
  buildTabs();
  buildWall();
  updateSoundBtn();
  showTab("dashboard");
  // warm both caches -- ours and the server's segment-duration memo -- while
  // the dashboard is what's on screen, so the first camera tab opens cold
  // exactly never
  cameras.forEach((cam) => refreshDays(cam).catch(() => {}));
}
init();

// pick up segments recorded since the page loaded, without disturbing what is
// on screen. (The live edge itself is advanced every second by the clock, not
// here -- it tracks real time, not how much has been written to disk.)
setInterval(() => {
  if (currentCam) refreshDays().catch(() => {});
}, 45000);
</script>
</body>
</html>
