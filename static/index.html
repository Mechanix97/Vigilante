<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIGILANTE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');

  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --surface: #12151c;
    --surface-2: #171b24;
    --border: #262b36;
    --text: #eef0f4;
    --muted: #8992a3;
    --faint: #565f70;
    --accent: #5b8cff;
    --accent-dim: #5b8cff33;
    --live: #ff4d5e;
    --live-dim: #ff4d5e26;
    --radius: 14px;
    --radius-sm: 9px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  [hidden] { display: none !important; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- header ---------- */
  header {
    flex: 0 0 auto;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    background: linear-gradient(180deg, var(--surface), var(--bg));
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--live);
    box-shadow: 0 0 0 3px var(--live-dim);
    animation: pulse 2s ease-in-out infinite;
  }
  header h1 {
    font-size: 15px; margin: 0; font-weight: 800; letter-spacing: .16em;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--border);
          border-radius: 10px; padding: 3px; }
  .tabs button {
    background: transparent; color: var(--muted); border: 0;
    border-radius: 7px; padding: 7px 16px; cursor: pointer; font: inherit;
    font-weight: 600; font-size: 13px; text-transform: capitalize;
    transition: background .15s, color .15s;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { background: var(--accent); color: #fff; }
  .tabs button[data-tab="dashboard"] { text-transform: none; letter-spacing: .03em; }

  main { padding: 20px; max-width: 1500px; margin: 0 auto; width: 100%; }
  main#dashboard { padding: 0; margin: 0; max-width: none; flex: 1 1 auto; min-height: 0; }
  main#single { flex: 1 1 auto; min-height: 0; overflow-y: auto; }

  /* ---------- dashboard: full-bleed live wall ---------- */
  .dashboard { height: 100%; display: grid; grid-template-columns: 1fr; grid-auto-rows: 1fr; gap: 2px; background: var(--border); }
  @media (min-width: 700px) {
    .dashboard.n2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .dashboard.n3, .dashboard.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  }
  .tile { background: #000; overflow: hidden; cursor: pointer; position: relative; min-height: 0; }
  .tile iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
  .tile .label {
    position: absolute; left: 16px; top: 14px; padding: 6px 14px;
    background: rgba(10,12,16,.6); border: 1px solid rgba(255,255,255,.08);
    border-radius: 8px; font-weight: 700; font-size: 15px;
    text-transform: capitalize; backdrop-filter: blur(6px);
    display: flex; align-items: center; gap: 8px;
  }
  .tile .label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 2s ease-in-out infinite; }
  .tile:hover { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ---------- single camera view: no title, straight to the picture ---------- */
  /* width-driven 16:9 box, centered: aspect-ratio derives the height, so it
     never stretches/distorts regardless of how tall the viewport is */
  .viewport-wrap { display: flex; justify-content: center; }
  .viewport {
    background: #000; border-radius: var(--radius); overflow: hidden;
    aspect-ratio: 16/9; width: 100%; max-width: 1100px;
    position: relative; border: 1px solid var(--border);
  }
  .viewport iframe, .viewport video { width: 100%; height: 100%; border: 0; display: block; }
  .viewport .empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--faint); font-size: 13px; text-align: center; padding: 0 24px;
  }

  /* ---------- scrub bar: live toggle + day picker + jump, always live ---------- */
  .scrub {
    margin: 14px auto 0; max-width: 1100px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px;
  }
  .scrub-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .live-btn {
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
    padding: 8px 16px; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 700;
    font-size: 13px; letter-spacing: .04em; transition: all .15s;
  }
  .live-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .live-btn.active { background: var(--live-dim); border-color: var(--live); color: var(--live); }
  .live-btn.active .dot { background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
  .live-btn:hover { border-color: var(--accent); color: var(--text); }
  .live-btn.active:hover { border-color: var(--live); color: var(--live); }

  .transport { display: flex; align-items: center; gap: 4px; }
  .transport button {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; width: 36px; height: 32px; cursor: pointer; font: inherit; font-size: 15px;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .transport button:hover:not(:disabled) { border-color: var(--accent); }
  .transport button:disabled { opacity: .35; cursor: default; }

  .scrub-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  #day-select, #speed-select {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font: inherit; font-weight: 600; font-size: 13px;
    color-scheme: dark; cursor: pointer;
  }
  #day-select:disabled, #speed-select:disabled { opacity: .35; cursor: default; }
  #day-select { text-transform: capitalize; }

  input[type="range"].timeline {
    -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
    border-radius: 99px; background: var(--surface-2); cursor: pointer; outline: none;
  }
  input[type="range"].timeline:disabled { cursor: default; opacity: .35; }
  input[type="range"].timeline::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 3px solid #fff2; cursor: pointer;
    box-shadow: 0 0 0 4px var(--accent-dim);
  }
  input[type="range"].timeline::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: var(--accent);
    border: 3px solid #fff2; cursor: pointer; box-shadow: 0 0 0 4px var(--accent-dim);
  }
  .scrub-clock {
    margin-top: 12px; text-align: center; font-size: 26px; font-weight: 700; letter-spacing: .03em;
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span><h1>VIGILANTE</h1></div>
  <div class="tabs" id="tabs"></div>
</header>

<main id="dashboard" class="dashboard"></main>

<main id="single" hidden>
  <div class="viewport-wrap">
    <div class="viewport" id="viewport">
      <div class="empty">Cargando…</div>
    </div>
  </div>

  <div class="scrub">
    <div class="scrub-top">
      <button class="live-btn active" id="live-btn"><span class="dot"></span><span id="live-btn-label">EN VIVO</span></button>
      <div class="transport">
        <button id="back10-btn" title="Retroceder 10s" disabled>⏪</button>
        <button id="play-btn" title="Pausar/Reproducir" disabled>⏸</button>
        <button id="fwd10-btn" title="Avanzar 10s" disabled>⏩</button>
      </div>
      <div class="scrub-controls">
        <select id="speed-select" disabled>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
        <select id="day-select"></select>
      </div>
    </div>
    <input type="range" class="timeline" id="timeline" min="0" max="0" value="0" step="0.1">
    <div class="scrub-clock mono" id="clock">--:--:--</div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const viewport = $("#viewport");
const timeline = $("#timeline"), clock = $("#clock");
const daySelect = $("#day-select"), speedSelect = $("#speed-select");
const liveBtn = $("#live-btn"), liveBtnLabel = $("#live-btn-label");
const playBtn = $("#play-btn"), back10Btn = $("#back10-btn"), fwd10Btn = $("#fwd10-btn");
let cameras = [], mediamtxUrl = "", currentCam = null;
let allDays = [], activeDay = null, atLiveEdge = false;
let video = null, dragging = false, liveClockTimer = null;

function fmtDate(yyyymmdd) {
  return `${yyyymmdd.slice(6, 8)}/${yyyymmdd.slice(4, 6)}/${yyyymmdd.slice(0, 4)}`;
}
function fmtHMS(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds)) % 86400;
  const h = String(Math.floor(s / 3600)).padStart(2, "0");
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  const sec = String(s % 60).padStart(2, "0");
  return `${h}:${m}:${sec}`;
}
function liveSrc(cam) { return `${mediamtxUrl}/${cam}/`; }
function totalDuration(day) {
  const last = day.breaks[day.breaks.length - 1];
  return last ? last.cum + (last.dur ?? 0) : 0;
}

// ---------------- video position <-> wall-clock mapping ----------------
// `breaks` is [{cum, wall, dur}], dur:null meaning "runs to the end".
function videoToWall(breaks, v) {
  for (const b of breaks) {
    const d = b.dur == null ? Infinity : b.dur;
    if (v >= b.cum && v < b.cum + d) return b.wall + (v - b.cum);
  }
  const last = breaks[breaks.length - 1];
  return last ? last.wall + (last.dur ?? 0) : 0;
}
// ---------------- tabs ----------------
function buildTabs() {
  const tabs = $("#tabs");
  tabs.innerHTML = "";
  const mk = (tab, label) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.dataset.tab = tab;
    b.onclick = () => showTab(tab);
    tabs.appendChild(b);
  };
  mk("dashboard", "DASHBOARD");
  cameras.forEach((cam) => mk(cam, cam));
}

function showTab(tab) {
  document.querySelectorAll(".tabs button").forEach(
    (b) => b.classList.toggle("active", b.dataset.tab === tab));
  if (tab === "dashboard") {
    currentCam = null;
    stopLiveClock();
    document.title = "VIGILANTE";
    $("#single").hidden = true;
    $("#dashboard").hidden = false;
  } else {
    showCamera(tab);
  }
}

// ---------------- dashboard ----------------
function buildDashboard() {
  const grid = $("#dashboard");
  grid.className = "dashboard n" + cameras.length;
  grid.innerHTML = "";
  if (!cameras.length) {
    grid.innerHTML = '<div class="empty">Sin cámaras</div>';
    return;
  }
  cameras.forEach((cam) => {
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.innerHTML = mediamtxUrl
      ? `<iframe src="${liveSrc(cam)}" allow="autoplay"></iframe><span class="label"><span class="dot"></span>${cam}</span>`
      : `<span class="label">${cam}</span>`;
    tile.onclick = () => showTab(cam);
    grid.appendChild(tile);
  });
}

// ---------------- live clock (ticks for real while at the live edge) ----------------
function startLiveClock() {
  stopLiveClock();
  const tick = () => {
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "America/Argentina/Buenos_Aires",
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
    }).formatToParts(new Date());
    const get = (t) => parts.find((p) => p.type === t).value;
    clock.textContent = `${get("hour")}:${get("minute")}:${get("second")}`;
  };
  tick();
  liveClockTimer = setInterval(tick, 1000);
}
function stopLiveClock() {
  if (liveClockTimer) { clearInterval(liveClockTimer); liveClockTimer = null; }
}

// ---------------- day select ----------------
function buildDaySelect() {
  daySelect.innerHTML = "";
  allDays.forEach((d) => {
    const opt = document.createElement("option");
    opt.value = d.date;
    opt.textContent = d.live ? "Hoy" : fmtDate(d.date);
    daySelect.appendChild(opt);
  });
  if (activeDay) daySelect.value = activeDay.date;
}
daySelect.addEventListener("change", () => {
  const day = allDays.find((d) => d.date === daySelect.value);
  if (!day) return;
  if (day.live) enterLiveEdge(day); else enterPlayback(day, 0);
});

// ---------------- transport (pause, ±10s, speed) ----------------
function setTransportEnabled(enabled) {
  playBtn.disabled = back10Btn.disabled = fwd10Btn.disabled = speedSelect.disabled = !enabled;
}
function updatePlayIcon() {
  playBtn.textContent = video && !video.paused ? "⏸" : "▶";
}
playBtn.onclick = () => {
  if (!video) return;
  if (video.paused) video.play(); else video.pause();
};
back10Btn.onclick = () => { if (video) video.currentTime = Math.max(0, video.currentTime - 10); };
fwd10Btn.onclick = () => {
  if (video) video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 10);
};
speedSelect.addEventListener("change", () => {
  if (video) video.playbackRate = Number(speedSelect.value);
});

// ---------------- live edge (real mediamtx stream) ----------------
function enterLiveEdge(day) {
  activeDay = day;
  atLiveEdge = true;
  video = null;
  liveBtn.classList.add("active");
  liveBtnLabel.textContent = "EN VIVO";
  daySelect.value = day.date;
  setTransportEnabled(false);
  stopLiveClock();

  viewport.innerHTML = mediamtxUrl
    ? `<iframe src="${liveSrc(currentCam)}" allow="autoplay"></iframe>`
    : '<div class="empty">Vista en vivo no configurada</div>';

  const dur = totalDuration(day);
  timeline.max = dur;
  timeline.value = dur;
  startLiveClock();
}

// ---------------- playback (a specific day, or today rewound) ----------------
function enterPlayback(day, atSeconds) {
  activeDay = day;
  atLiveEdge = false;
  stopLiveClock();
  liveBtn.classList.remove("active");
  liveBtnLabel.textContent = "VOLVER A VIVO";
  daySelect.value = day.date;
  setTransportEnabled(true);

  const dur = totalDuration(day);
  timeline.max = dur;
  timeline.value = Math.min(atSeconds, dur);

  const alreadyPlaying = video && video.dataset.day === day.date;
  if (!alreadyPlaying) {
    viewport.innerHTML = "";
    video = document.createElement("video");
    video.controls = false;
    video.playsInline = true;
    video.autoplay = true;
    video.playbackRate = Number(speedSelect.value);
    video.dataset.day = day.date;
    video.src = day.url;
    viewport.appendChild(video);
    video.addEventListener("loadedmetadata", () => {
      video.currentTime = Math.min(atSeconds, video.duration || dur);
    });
    video.addEventListener("timeupdate", () => {
      if (!dragging) timeline.value = video.currentTime;
      clock.textContent = fmtHMS(videoToWall(activeDay.breaks, video.currentTime));
    });
    video.addEventListener("play", updatePlayIcon);
    video.addEventListener("pause", updatePlayIcon);
  } else {
    video.currentTime = Math.min(atSeconds, video.duration || dur);
  }
  updatePlayIcon();
  clock.textContent = fmtHMS(videoToWall(day.breaks, atSeconds));
}

liveBtn.onclick = () => {
  const today = allDays.find((d) => d.live);
  if (today) enterLiveEdge(today);
};

// dragging the slider left while at the live edge drops into playback, right
// back to the edge snaps back to the real live stream
timeline.addEventListener("input", () => {
  if (!activeDay) return;
  dragging = true;
  const v = Number(timeline.value);
  clock.textContent = fmtHMS(videoToWall(activeDay.breaks, v));
  if (atLiveEdge && v < timeline.max - 1) {
    enterPlayback(activeDay, v);
  }
});
timeline.addEventListener("change", () => {
  const v = Number(timeline.value);
  if (activeDay && activeDay.live && v >= timeline.max - 1) {
    enterLiveEdge(activeDay);
  } else if (video) {
    video.currentTime = v;
  }
  dragging = false;
});

// ---------------- per-camera bootstrap ----------------
async function refreshDays() {
  const { days } = await fetch(`/api/cameras/${currentCam}/days`).then((r) => r.json());
  allDays = days;
  buildDaySelect();
  return days;
}

async function showCamera(cam) {
  currentCam = cam;
  document.title = `VIGILANTE — ${cam}`;
  $("#dashboard").hidden = true;
  $("#single").hidden = false;

  const days = await refreshDays();
  const today = days.find((d) => d.live);
  if (today) enterLiveEdge(today);
  else if (days.length) enterPlayback(days[0], 0);
  else {
    activeDay = null; atLiveEdge = false; video = null;
    viewport.innerHTML = '<div class="empty">Sin grabaciones todavía para esta cámara</div>';
    timeline.max = 0; timeline.value = 0;
    clock.textContent = "--:--:--";
    setTransportEnabled(false);
  }
}

async function init() {
  const [{ cameras: cams }, cfg] = await Promise.all([
    fetch("/api/cameras").then((r) => r.json()),
    fetch("/api/config").then((r) => r.json()),
  ]);
  cameras = cams;
  mediamtxUrl = cfg.mediamtx_url;
  buildTabs();
  buildDashboard();
  showTab("dashboard");
}
init();

// keep today's data fresh so the live edge keeps extending, without
// disturbing whatever is currently on screen
setInterval(async () => {
  if (!currentCam) return;
  const days = await refreshDays();
  const today = days.find((d) => d.live);
  if (today && atLiveEdge) {
    activeDay = today;
    timeline.max = totalDuration(today);
    timeline.value = timeline.max;
  } else if (activeDay) {
    const match = days.find((d) => d.date === activeDay.date);
    if (match) activeDay = match;
  }
}, 45000);
</script>
</body>
</html>
