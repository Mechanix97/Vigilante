<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIGILANTE</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a;
    --text: #e6e8eb; --muted: #8b92a0; --accent: #4f8cff; --live: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .06em; }
  header button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit;
  }
  .live-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--live); margin-right: 6px; vertical-align: 1px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  [hidden] { display: none !important; }

  /* --- dashboard: all cameras, big --- */
  .dashboard {
    display: grid; grid-template-columns: 1fr; gap: 16px;
  }
  @media (min-width: 700px) {
    .dashboard.n2 { grid-template-columns: 1fr 1fr; }
    .dashboard.n3, .dashboard.n4 { grid-template-columns: 1fr 1fr; }
  }
  .tile {
    background: #000; border-radius: 10px; overflow: hidden; cursor: pointer;
    aspect-ratio: 16/9; position: relative; border: 1px solid var(--border);
  }
  .tile iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
  .tile .label {
    position: absolute; left: 10px; top: 10px; padding: 4px 10px;
    background: rgba(0,0,0,.55); border-radius: 5px; font-weight: 600;
    text-transform: capitalize; backdrop-filter: blur(2px);
  }

  /* --- single camera: live + recordings, one screen --- */
  .single-live {
    background: #000; border-radius: 10px; overflow: hidden;
    aspect-ratio: 21/9; max-height: 60vh;
  }
  .single-live iframe { width: 100%; height: 100%; border: 0; }
  .cam-title {
    margin: 16px 0 10px; font-size: 15px; font-weight: 700;
    text-transform: capitalize; display: flex; align-items: center; gap: 8px;
  }
  .rec-area {
    display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px;
  }
  @media (min-width: 900px) {
    .rec-area { grid-template-columns: 2fr 1fr; align-items: start; }
  }
  .player {
    background: #000; border-radius: 8px; overflow: hidden;
    aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
  }
  video { width: 100%; height: 100%; display: block; }
  .placeholder { color: var(--muted); font-size: 13px; text-align: center; padding: 0 20px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; max-height: 50vh; overflow-y: auto;
  }
  .panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin: 0 0 8px;
  }
  .panel + .panel { margin-top: 16px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li button {
    width: 100%; text-align: left; background: none; border: none; color: var(--text);
    padding: 8px 6px; border-radius: 6px; cursor: pointer; font: inherit;
    display: flex; justify-content: space-between; gap: 8px;
  }
  li button:hover { background: #232834; }
  li button.playing { background: var(--accent); color: #fff; }
  li .size { color: var(--muted); font-variant-numeric: tabular-nums; }
  li button.playing .size { color: #dbe6ff; }
  .empty { color: var(--muted); padding: 8px 6px; }
</style>
</head>
<body>
<header>
  <h1>VIGILANTE</h1>
  <button id="back" hidden>← Todas las cámaras</button>
</header>

<main id="dashboard" class="dashboard"></main>

<main id="single" hidden>
  <div class="single-live" id="single-live"></div>
  <div class="cam-title"><span class="live-dot"></span><span id="cam-name"></span></div>
  <div class="rec-area">
    <div class="player">
      <video id="video" controls playsinline></video>
      <div class="placeholder" id="placeholder">Elegí una grabación de la derecha para verla acá</div>
    </div>
    <div>
      <div class="panel">
        <h2>Hoy (segmentos sin consolidar)</h2>
        <ul id="today"><li class="empty">-</li></ul>
      </div>
      <div class="panel">
        <h2>Días anteriores</h2>
        <ul id="days"><li class="empty">-</li></ul>
      </div>
    </div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const video = $("#video"), placeholder = $("#placeholder");
let cameras = [], mediamtxUrl = "", currentCam = null, activeBtn = null, activeUrl = null;

function fmtSize(bytes) {
  const mb = bytes / 1e6;
  return mb >= 1000 ? (mb / 1000).toFixed(1) + " GB" : mb.toFixed(0) + " MB";
}
function fmtTime(hhmmss) {
  return hhmmss.slice(0, 2) + ":" + hhmmss.slice(2, 4) + ":" + hhmmss.slice(4, 6);
}
function fmtDate(yyyymmdd) {
  return `${yyyymmdd.slice(6, 8)}/${yyyymmdd.slice(4, 6)}/${yyyymmdd.slice(0, 4)}`;
}
function liveSrc(cam) {
  return `${mediamtxUrl}/${cam}/`;
}

// --- dashboard: every camera, live, big ---
function buildDashboard() {
  const grid = $("#dashboard");
  grid.className = "dashboard n" + cameras.length;
  grid.innerHTML = "";
  if (!cameras.length) {
    grid.innerHTML = '<div class="placeholder">Sin cámaras</div>';
    return;
  }
  cameras.forEach((cam) => {
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.innerHTML = mediamtxUrl
      ? `<iframe src="${liveSrc(cam)}" allow="autoplay"></iframe><span class="label">${cam}</span>`
      : `<span class="label">${cam}</span>`;
    tile.onclick = () => openCamera(cam);
    grid.appendChild(tile);
  });
}

// --- single camera: its own live view + recordings, same screen ---
function openCamera(cam) {
  currentCam = cam;
  activeBtn = null; activeUrl = null;
  video.removeAttribute("src");
  video.style.display = "none";
  placeholder.style.display = "block";

  $("#dashboard").hidden = true;
  $("#single").hidden = false;
  $("#back").hidden = false;
  $("#cam-name").textContent = cam;
  $("#single-live").innerHTML = mediamtxUrl
    ? `<iframe src="${liveSrc(cam)}" allow="autoplay"></iframe>` : "";
  document.title = `VIGILANTE — ${cam}`;
  loadRecordings(cam);
}

function closeCamera() {
  currentCam = null;
  $("#single-live").innerHTML = "";
  $("#single").hidden = true;
  $("#dashboard").hidden = false;
  $("#back").hidden = true;
  document.title = "VIGILANTE";
}
$("#back").onclick = closeCamera;

function play(url, label, btn) {
  if (activeUrl !== url) {
    video.src = url;
    video.play().catch(() => {});
    activeUrl = url;
  }
  placeholder.style.display = "none";
  video.style.display = "block";
  if (activeBtn) activeBtn.classList.remove("playing");
  if (btn) { btn.classList.add("playing"); activeBtn = btn; }
}

async function loadRecordings(cam) {
  const [today, days] = await Promise.all([
    fetch(`/api/cameras/${cam}/today`).then((r) => r.json()),
    fetch(`/api/cameras/${cam}/days`).then((r) => r.json()),
  ]);

  const todayUl = $("#today");
  todayUl.innerHTML = "";
  if (!today.segments.length) {
    todayUl.innerHTML = '<li class="empty">sin segmentos todavía</li>';
  } else {
    [...today.segments].reverse().forEach((s) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.innerHTML = `<span>${fmtTime(s.time)}</span><span class="size">${fmtSize(s.size)}</span>`;
      btn.onclick = () => play(s.url, `${cam} ${fmtTime(s.time)}`, btn);
      li.appendChild(btn);
      todayUl.appendChild(li);
    });
  }

  const daysUl = $("#days");
  daysUl.innerHTML = "";
  if (!days.days.length) {
    daysUl.innerHTML = '<li class="empty">sin días consolidados todavía</li>';
  } else {
    days.days.forEach((d) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.innerHTML = `<span>${fmtDate(d.date)}</span><span class="size">${fmtSize(d.size)}</span>`;
      btn.onclick = () => play(d.url, `${cam} ${fmtDate(d.date)}`, btn);
      li.appendChild(btn);
      daysUl.appendChild(li);
    });
  }
}

async function init() {
  const [{ cameras: cams }, cfg] = await Promise.all([
    fetch("/api/cameras").then((r) => r.json()),
    fetch("/api/config").then((r) => r.json()),
  ]);
  cameras = cams;
  mediamtxUrl = cfg.mediamtx_url;
  buildDashboard();
}
init();

// keep the current camera's recordings list fresh, and the dashboard's
// selection state, without a manual reload
setInterval(() => {
  if (currentCam) loadRecordings(currentCam);
}, 30000);
</script>
</body>
</html>
