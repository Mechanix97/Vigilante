services:
  vigilante:
    build: .
    image: vigilante:latest
    container_name: vigilante
    user: "1000:1000"
    ports:
      - "8090:8090"
    environment:
      - DAILY_DIR=/daily
      - RECORD_DIR=/rec
      - TZ_OFFSET_HOURS=-3
      # reachable from the *browser*, not just this container -- point it at
      # whatever hostname/IP mediamtx's :8889 is published on (Tailscale/LAN)
      - MEDIAMTX_URL=http://homelab:8889
    volumes:
      # read-only: this app never writes into aidot-webrtc's output
      - /mnt/hdd/aidot-daily:/daily:ro
      - /mnt/hdd/aidot:/rec:ro
      # the UI is a single static file: mounting it means a change needs a
      # browser refresh, not an image rebuild
      - ./static:/app/static:ro
    restart: unless-stopped
